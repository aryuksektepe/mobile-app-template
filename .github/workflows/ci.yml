# Canonical CI for projects built from this template.
#
# Static checks (analyze + mocked tests + line coverage) are NECESSARY but NOT
# SUFFICIENT: they structurally cannot see compile-time, app-boot, or
# real-backend defects, nor Riverpod/stream lifecycle storms. The runtime jobs
# (`build-and-boot`, `build-ios`, `backend-integration`, `integration-smoke`)
# mirror the `INTEGRATION_SMOKE` gate (CLAUDE.md §3, §9).
#
# TRIGGER = MANUAL ONLY (workflow_dispatch). This template's design enforces the
# runtime gate LOCALLY every phase: the agent runs `tool/run_smoke.sh` on the
# local emulator and the `verify-smoke.py` hook blocks the gate on fake/missing
# evidence (ADR-011) — no GitHub minutes needed. The pipeline also STOPS at the
# QA_SMOKE_TEST gate and asks YOU to test on a device (qa-test-guide). So GitHub
# CI here would just re-run, on paid minutes, what already ran locally. It is
# kept available as an OPTIONAL on-demand batch confirmation: run it by hand from
# the Actions tab ("Run workflow") when you want a clean cloud check before a
# release. To restore auto-on-push, add `push:`/`pull_request:` back under `on:`.
# (ADR-013.)
#
# app-bootstrap regenerates a per-project copy during Phase 01 (its §5.D) —
# that copy MUST keep these jobs. Drop build-ios only for an Android-only
# project; drop backend-integration only when there is no backend at all.
# Never drop them silently — log the skip in the phase file.
name: CI

on:
  workflow_dispatch:   # manual only — click "Run workflow" in the Actions tab

jobs:
  # Guard: this is a TEMPLATE repo — until a real project is bootstrapped
  # (app-bootstrap creates pubspec.yaml + lib/), there is nothing to build, so
  # every Flutter job would fail at `flutter pub get` and burn CI minutes on
  # every push. This cheap (<10s) job detects an app and gates all real jobs on
  # it, so the empty template skips the heavy matrix entirely (skipped != failed
  # → no failure email, no wasted minutes). CI fully runs the moment a project
  # exists. (CLAUDE.md §9 CI economy.)
  guard:
    name: Detect Flutter app (template guard)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f pubspec.yaml ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
            echo "Flutter project detected — running full CI."
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.yaml — empty template repo. Skipping build/test jobs."
          fi

  analyze-test:
    name: Static — analyze + mocked tests + generated-clean
    needs: guard
    if: needs.guard.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: dart run build_runner build --delete-conflicting-outputs
      # Generated code must match a fresh build_runner. Exclude
      # non-deterministic timestamped generated artifacts (audit reports etc.)
      # from the diff gate — they are a recurring false-fail source; either
      # generate them deterministically or list them here / in .gitattributes.
      - name: Generated code is clean (deterministic codegen)
        run: |
          git diff --exit-code -- . \
            ':(exclude).project/qa-runs/**' \
            ':(exclude)**/*.audit.md' \
            ':(exclude)**/generated-report-*'
      - run: flutter test --coverage

  build-and-boot:
    name: Build + Boot smoke (Android)
    needs: guard
    if: needs.guard.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Single source of truth: the SAME tool/run_smoke.sh the in-loop gate runs.
      # It compiles (catches native/Gradle/Kotlin/desugaring/manifest), boots on
      # the emulator, runs integration_test/, asserts BOOT_OK/FIRST_SCREEN_OK
      # markers, and exits non-zero on any failure. (CLAUDE.md §3 / ADR-011)
      - name: Build + boot smoke (proof-of-work, run_smoke.sh)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash tool/run_smoke.sh ci dev
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-android
          path: .project/qa-runs/smoke-*.log
          if-no-files-found: ignore

  build-ios:
    name: Build (iOS, no codesign)
    needs: guard
    if: needs.guard.outputs.has_app == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Compile iOS (catches CocoaPods/Swift/entitlement defects)
        run: flutter build ios --flavor dev --debug --no-codesign --target lib/main_dev.dart

  backend-integration:
    name: Non-mocked integration (local Supabase)
    needs: guard
    if: needs.guard.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - name: Serve Edge Functions + smoke an authenticated call
        run: |
          set -euo pipefail
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            supabase functions serve --no-verify-jwt=false &
            sleep 5
            # Fail LOUDLY on the ES256<->HS256 / verify_jwt class before launch.
            # NOTE: no '|| true' — this step MUST gate. Projects extend it with a
            # real authenticated 2xx call per new function (INTEGRATION_SMOKE #4).
            curl -fsS -X OPTIONS "${SUPABASE_URL:-http://localhost:54321}/functions/v1/health"
          else
            echo "No Edge Functions present yet — nothing to smoke. Per-feature \
            work wires a real authenticated call here before the fn ships."
          fi
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Run integration tests against real local backend
        run: flutter test integration_test/ --exclude-tags=mocked

  # Consolidated runtime gate — emulator matrix, merge-to-main only (keeps the
  # Actions budget sane on PRs while still gating the protected branch).
  integration-smoke:
    name: Integration smoke (emulator matrix)
    needs: guard
    if: needs.guard.outputs.has_app == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Android: boot a real emulator and run the SAME run_smoke.sh as the loop.
      - name: Smoke (Android emulator, run_smoke.sh)
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash tool/run_smoke.sh ci dev
      # iOS: actually boot a simulator (the old job only echoed instructions and
      # never booted one), then run the SAME run_smoke.sh on it.
      - name: Smoke (iOS simulator, run_smoke.sh)
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          DEVICE="iPhone 15"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          bash tool/run_smoke.sh ci dev
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}
          path: .project/qa-runs/smoke-*.log
          if-no-files-found: ignore
